name: Test Market Dashboard

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - '.github/workflows/market-dashboard.yml'
      - 'qdii-watcher/*market*.py'
      - 'qdii-watcher/market-dashboard.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test quote parsing and failure preservation
        run: python3 -m unittest discover -s qdii-watcher -p 'test_*market*.py'
